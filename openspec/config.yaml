schema: spec-driven

context: |
  Проект: Kinobot — Telegram-бот и Flask веб-интерфейс рекомендаций
  фильмов и сериалов. Источник данных — Kinopoisk API
  (api.kinopoisk.dev), понимание запросов — LLM (GigaChat основной,
  DeepSeek запасной при ENABLE_DEEPSEEK=true), PostgreSQL используется
  только для админки и статистики веб-интерфейса.

  Технологический стек: Python 3.10 локально / 3.11 в Docker,
  python-telegram-bot 20.x, Flask 3, Flask-SQLAlchemy, Flask-Login,
  aiohttp, tenacity. GigaChat API требует отключённой проверки
  SSL-сертификатов — это намеренно, не «чинить».

  Соглашения:
  - Весь код, комментарии и пользовательские тексты — на русском.
  - Импорты внутри src/ плоские (без префикса пакета): запуск бота
    `python src\telegram_bot.py`, веба `python src\app.py`.
    Запуск с `-m` из корня не работает.
  - app.py делает chdir в src/, поэтому веб-логи пишутся в src/logs/.
  - Тестов, линтера, тайпчекера и CI нет; верификация — запуск
    сервиса (для веба GET /health) или ручной диалог с ботом.
  - Интенты (initial / info / similar / alternative) и извлечение
    параметров управляются текстовыми промптами в src/prompts/ —
    поведение меняется без правки кода.
  - Деплой: образ собирается локально и пушится в
    kinobot-ai.cr.cloud.ru/beta/kinobot-ai, затем ssh/scp на VM и
    `docker compose -f docker-compose.prod.yml up -d`
    (compose-файл продакшена живёт на VM, в репо отсутствует).
    Порядок и команды — в docs/.

  Известные ловушки:
  - Сессии пользователей и кэш поиска — in-memory: теряются при
    рестарте и не разделяются между воркерами.
  - Модели БД продублированы: src/models/database.py и init_db.py.
    При изменении схемы нужно синхронизировать оба файла.
  - Текущий год захардкожен в нескольких местах.
  - README.md — черновик-концепция, а не документация; рабочие
    заметки в docs/.

rules:
  proposal:
    - Пиши на русском языке
    - Включай раздел «Не входит в изменение» (non-goals)
  design:
    - Пиши на русском языке
    - Фиксируй решения, влияющие на деплой и совместимость с
      продакшен-образом (тег в docker-compose, CMD в Dockerfile)
  tasks:
    - Пиши на русском языке
    - Каждая задача должна иметь проверяемый критерий (команда запуска,
      эндпоинт или наблюдаемое поведение)
  specs:
    - Пиши на русском языке
