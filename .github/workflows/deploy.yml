# Деплой Kinobot на VPS.
# Триггеры: пуш тега релиза v* или ручной запуск (workflow_dispatch)
# с указанием тега — в том числе для отката на предыдущую версию.
# Схема: исходники доставляются на VPS по ssh, образ собирается на VPS,
# запуск через docker compose. Внешний реестр образов не используется.

name: Деплой на VPS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза для деплоя (например, v1.1.0)'
        required: true
        type: string

env:
  DEPLOY_TAG: ${{ inputs.tag || github.ref_name }}
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT }}

jobs:
  deploy:
    name: Сборка и деплой
    runs-on: ubuntu-latest
    steps:
      - name: Проверка секретов (до обращения к VPS)
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_PORT" ] || [ -z "$VPS_SSH_PRIVATE_KEY" ] || [ -z "$ENV_PRODUCTION" ]; then
            echo "::error::Не заданы секреты деплоя (VPS_SSH_PRIVATE_KEY, VPS_HOST, VPS_USER, VPS_PORT, ENV_PRODUCTION)"
            exit 1
          fi
          echo "Тег деплоя: $DEPLOY_TAG"

      - name: Checkout целевого тега
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_TAG }}

      - name: Настройка SSH-доступа к VPS
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          SSH_OPTS="-i $HOME/.ssh/vps_key -p $VPS_PORT -o StrictHostKeyChecking=yes"
          echo "SSH_OPTS=$SSH_OPTS" >> "$GITHUB_ENV"
          # у scp порт задаётся через -P (не -p)
          SCP_OPTS="-i $HOME/.ssh/vps_key -P $VPS_PORT -o StrictHostKeyChecking=yes"
          echo "SCP_OPTS=$SCP_OPTS" >> "$GITHUB_ENV"

      - name: Доставка исходников на VPS (rsync)
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '.env*' \
            --exclude 'logs' \
            --exclude 'src/logs' \
            --exclude 'data' \
            --exclude 'docs' \
            --exclude 'openspec' \
            --exclude '__pycache__' \
            -e "ssh $SSH_OPTS" \
            ./ "$VPS_USER@$VPS_HOST:~/kinobot/app/"

      - name: Сборка образа на VPS
        run: |
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "cd ~/kinobot/app && docker build -t kinobot-ai:$DEPLOY_TAG ."

      - name: Обновление compose-файла на VPS
        run: |
          scp $SCP_OPTS deploy/docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:~/kinobot/docker-compose.prod.yml"

      - name: Запись .env.production на VPS
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          printf '%s\n' "$ENV_PRODUCTION" | ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "cat > ~/kinobot/.env.production && chmod 600 ~/kinobot/.env.production"

      - name: Резервное копирование БД (pg_dump)
        run: |
          echo "Проверка состояния контейнера PostgreSQL на VPS..."
          PG_RUNNING=$(ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "docker inspect -f '{{.State.Running}}' kinobot_postgres 2>&1") || {
            # Контейнера ещё нет (первичный деплой на свежий VPS) — пропуск с
            # предупреждением; ЛЮБОЙ иной сбой ssh/docker фатален: транспортная
            # ошибка не должна выглядеть как «бэкап не нужен», иначе миграции
            # покатятся без резервной копии.
            case "$PG_RUNNING" in
              *"No such object"*)
                echo "::warning::kinobot_postgres не найден на VPS — бэкап пропущен (первичный деплой)"
                exit 0
                ;;
              *)
                echo "::error::Не удалось проверить состояние kinobot_postgres ($PG_RUNNING) — бэкап не снят, деплой прерван"
                exit 1
                ;;
            esac
          }
          if [ "$PG_RUNNING" != "true" ]; then
            echo "::warning::kinobot_postgres не запущен (статус: $PG_RUNNING) — бэкап пропущен"
            exit 0
          fi
          # Бэкап снимается СТРОГО до запуска контейнеров и наката миграций:
          # применять схему без резервной копии недопустимо, поэтому шаг
          # фатальный (без `|| true`). Ротация — 7 суток. Дата/время вычисляются
          # на VPS: `\$` экранирован, иначе подстановку выполнил бы раннер.
          # БЕЗ пайплайна на удалённой стороне (`pg_dump | gzip`): код возврата
          # пайплайна — код ПОСЛЕДНЕЙ команды (gzip), сбой pg_dump остался бы
          # незамеченным, а архив — пустым/битым. Дамп пишется файлом .sql, затем
          # `gzip -f` того же файла: ненулевой выход pg_dump рвёт цепочку `&&`.
          # Итоговый архив — ~/kinobot/backups/kinobot_db_<дата_время>.sql.gz.
          # Учётные данные — дефолты compose (DB_USER=postgres, DB_NAME=kinobot_db);
          # при иных значениях в .env.production шаг правит оператор.
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "mkdir -p ~/kinobot/backups && \
             DUMP=~/kinobot/backups/kinobot_db_\$(date +%F_%H%M).sql && \
             docker exec kinobot_postgres pg_dump -U postgres kinobot_db > \$DUMP && \
             gzip -f \$DUMP && \
             find ~/kinobot/backups -name 'kinobot_db_*.sql.gz' -mtime +7 -delete"
          echo "Резервная копия БД сохранена в ~/kinobot/backups/*.sql.gz (хранится 7 суток)."

      - name: Запуск контейнеров
        run: |
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "cd ~/kinobot && APP_VERSION=$DEPLOY_TAG \
             docker compose --env-file .env.production -f docker-compose.prod.yml up -d"

      - name: Применение миграций БД (alembic upgrade head)
        run: |
          echo "Ожидание 15 секунд: контейнер kinobot должен подняться..."
          sleep 15
          # Шаг ФАТАЛЬНЫЙ (без `|| true`): старт с рассинхроном схемы хуже
          # упавшего деплоя — оператор откатывает релиз (workflow_dispatch на
          # старый тег), данные защищены бэкапом предыдущего шага. Штатный старт
          # бота уже накатывает миграции (src/db_migrations.py, fail-silent) —
          # этот exec-прогон контрольный и идемпотентный (no-op, если схема
          # актуальна), но даёт деплою явную проверку результата.
          if ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "docker exec kinobot alembic upgrade head"; then
            echo "Миграции БД применены (alembic upgrade head)."
          else
            echo "::error::Миграции БД не применились (alembic upgrade head) — деплой прерван"
            ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "docker logs --tail 50 kinobot" || true
            exit 1
          fi

      - name: Создание/проверка админа БД (init_db.py)
        run: |
          # Шаг НЕфатальный (поглощает задачу T8): init_db.py идемпотентен
          # (create_all после upgrade head — no-op плюс создание/проверка админа
          # из ADMIN_PASSWORD), его сбой не должен ронять релиз — логируем
          # предупреждение и продолжаем до health-чека.
          if ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "docker exec kinobot python init_db.py"; then
            echo "Админ БД создан/проверен (init_db.py)."
          else
            echo "::warning::init_db.py завершился ошибкой — деплой продолжается, админа создать вручную (docs/dev_guide.md)"
          fi

      - name: Проверка результата деплоя
        run: |
          echo "Ожидание 30 секунд после старта..."
          sleep 30
          FAIL=0
          for c in kinobot kinobot-web; do
            STATE=$(ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
              "docker inspect -f '{{.State.Status}}' $c" || echo "missing")
            RESTARTS=$(ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
              "docker inspect -f '{{.RestartCount}}' $c" || echo "-1")
            echo "Контейнер $c — статус: $STATE, перезапусков: $RESTARTS"
            if [ "$STATE" != "running" ] || [ "$RESTARTS" != "0" ]; then
              echo "::error::Контейнер $c не работает (статус: $STATE, перезапусков: $RESTARTS)"
              ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "docker logs --tail 50 $c" || true
              FAIL=1
            fi
          done
          HTTP_CODE=$(ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:5000/health" || echo "000")
          echo "Код ответа /health: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "503" ]; then
            echo "::error::Веб-приложение не отвечает на /health (код: $HTTP_CODE)"
            FAIL=1
          fi
          if [ "$FAIL" != "0" ]; then
            exit 1
          fi
          echo "Деплой успешен: контейнеры работают без перезапусков, веб-приложение отвечает."

      - name: Очистка неиспользуемых образов
        if: always()
        run: |
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "docker image prune -f" || true
