# Продакшен-конфигурация для VPS (файл лежит в ~/kinobot/ рядом
# с .env.production). Образ бота собирается на самом VPS пайплайном
# деплоя; тег образа равен тегу релиза и передаётся через APP_VERSION.

services:
  postgres:
    image: postgres:15-alpine
    container_name: kinobot_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-kinobot_db}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kinobot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kinobot:
    image: kinobot-ai:${APP_VERSION}
    container_name: kinobot
    restart: on-failure:3
    env_file:
      - .env.production
    volumes:
      - app_logs:/app/logs
    networks:
      - kinobot-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-kinobot_db}

networks:
  kinobot-network:
    driver: bridge

volumes:
  app_logs:
  postgres_data:
