# Конфигурация Alembic проекта kinobot (бэклог T11).
#
# ВАЖНО: строка подключения здесь НЕ задаётся — migrations/env.py берёт её
# из переменной окружения DATABASE_URL (fallback — локальный PostgreSQL из
# src/db_bootstrap.DEFAULT_DATABASE_URL). Хардкод боевого URL/секретов в
# репозитории запрещён.

[alembic]
# Каталог миграций: путь относительно ЭТОГО файла (%(here)s), а не текущего
# каталога процесса — команды alembic работают из любого cwd (в T12 веб-процесс
# делает chdir в src/, программный запуск command.upgrade() тоже не должен
# зависеть от cwd).
script_location = %(here)s/migrations

# Именование файлов ревизий: <rev>_<slug>.py — например, baseline
# 0001_initial.py (идентификатор задан явно: --rev-id 0001); последующие
# ревизии получают обычные идентификаторы alembic.
file_template = %%(rev)s_%%(slug)s

# Текущий рабочий каталог добавляется в начало sys.path (поведение шаблона).
prepend_sys_path = .

# Разделитель списков путей (os.pathsep).
path_separator = os

# Кодировка файлов ревизий (русские комментарии — utf-8).
output_encoding = utf-8

# Заглушка: значение подставляет migrations/env.py из окружения (см. шапку).
sqlalchemy.url =

[post_write_hooks]
# Хуки постобработки сгенерированных ревизий не используются.

# Логирование — настройки потребляются migrations/env.py (fileConfig);
# сообщения окружения и рантайма миграций — на русском.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
