<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('admin.dashboard') }}">🎬 KinoBot Admin</a>
            <div class="d-flex">
                <a href="{{ url_for('admin.profile') }}" class="btn btn-outline-light btn-sm me-2">Профиль</a>
                <a href="{{ url_for('admin.admin_logout') }}" class="btn btn-outline-light btn-sm">Выход</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Детальная статистика</h2>

        <div class="mb-3">
            <a href="?days=7" class="btn btn-sm btn-primary">7 дней</a>
            <a href="?days=30" class="btn btn-sm btn-primary">30 дней</a>
            <a href="?days=90" class="btn btn-sm btn-primary">90 дней</a>
        </div>

        <canvas id="usersChart" height="100"></canvas>
        <canvas id="queriesChart" height="100" class="mt-4"></canvas>
    </div>

    <script>
        const chartData = {{ chart_data | tojson }};

        // График уникальных пользователей
        new Chart(document.getElementById('usersChart'), {
            type: 'line',
            data: {
                labels: chartData.dates,
                datasets: [{
                    label: 'Уникальные пользователи',
                    data: chartData.unique_users,
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1
                }]
            }
        });

        // График запросов
        new Chart(document.getElementById('queriesChart'), {
            type: 'line',
            data: {
                labels: chartData.dates,
                datasets: [{
                    label: 'Всего запросов',
                    data: chartData.total_queries,
                    borderColor: 'rgb(255, 99, 132)',
                    tension: 0.1
                }]
            }
        });
    </script>
</body>
</html>
